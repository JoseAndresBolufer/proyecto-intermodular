<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoraMón Viatges | Crear guía</title>
  <link rel="stylesheet" href="../css/styles4.css" />
</head>
<body>

  <aside class="barra-lateral">

    <div class="logo">
      <a href="../index4.html">
        <img src="../img/Logo.resize.PNG" alt="VoraMón Viatges">
      </a>
    </div>

    <nav>
      <a href="../index4.html">Home</a>

      <a href="inscripcion.html">Inscripción</a>

      <a href="listado-destinos.html">Destinos</a>

      <a href="listado-usuarios.html">Usuarios</a>

      <a href="listado-guias.html" class="active">Guías</a>
    </nav>

  </aside>

  <main class="contenido-principal">

    <header class="cabecera">
      <h1>Crear guía</h1>
      <span>Registro de nuevos guías turísticos</span>
    </header>

    <section class="contenedor-formulario">

      <p class="info-text">
        Introduce los datos del guía y selecciona su especialidad principal.
      </p>

      <form>

        <h2>Datos del guía</h2>

        <div class="grupo-formulario">
          <label for="nombre">Nombre</label>

          <input 
            type="text" 
            id="nombre" 
            name="nombre" 
            required>
        </div>

        <div class="grupo-formulario">
          <label for="apellidos">Apellidos</label>

          <input 
            type="text" 
            id="apellidos" 
            name="apellidos" 
            required>
        </div>

        <div class="grupo-formulario">
          <label for="nacionalidad">Nacionalidad</label>

          <input 
            type="text"
            id="nacionalidad"
            name="nacionalidad"
            placeholder="Ej: Española"
            required>
        </div>

        <div class="grupo-formulario">
          <label for="tipoDocumento">
            Tipo de documento
          </label>

          <select 
            id="tipoDocumento" 
            name="tipoDocumento" 
            required>

            <option value="">
              Selecciona una opción
            </option>

            <option value="dni">
              DNI
            </option>

            <option value="nie">
              NIE
            </option>

            <option value="pasaporte">
              Pasaporte
            </option>

            <option value="otro">
              Otro
            </option>

          </select>
        </div>

        <div class="grupo-formulario">
          <label for="numeroDocumento">
            Número de documento
          </label>

          <input 
            type="text"
            id="numeroDocumento"
            name="numeroDocumento"
            placeholder="Ej: X1234567"
            required>
        </div>

        <div class="grupo-formulario">
          <label for="telefono">Teléfono</label>

          <input 
            type="tel" 
            id="telefono" 
            name="telefono"
            pattern="[0-9]{9}"
            placeholder="Ej: 600123456"
            required>
        </div>

        <div class="grupo-formulario">
          <label for="email">Email</label>

          <input 
            type="email" 
            id="email" 
            name="email"
            placeholder="Ej: guia@voramon.com"
            required>
        </div>

        <div class="grupo-formulario">
          <label for="especialidad">
            Especialidad
          </label>

          <select 
            id="especialidad" 
            name="especialidad" 
            required>

            <option value="">
              Selecciona una especialidad
            </option>

            <option value="geografia">
              Geografía
            </option>

            <option value="historia">
              Historia
            </option>

            <option value="arquitectura">
              Arquitectura
            </option>

            <option value="comida">
              Comida
            </option>

          </select>
        </div>

        <div class="grupo-formulario">
          <label for="destinoTrabajo">
            Destino donde trabajará
          </label>

          <select 
            id="destinoTrabajo"
            name="destinoTrabajo"
            required>

            <option value="">
              Selecciona un destino
            </option>

            <option value="roma">
              Roma
            </option>

            <option value="tokio">
              Tokio
            </option>

            <option value="paris">
              París
            </option>

          </select>
        </div>

        <button type="submit">
          Guardar guía
        </button>

      </form>

    </section>

  </main>

</body>
</html>
