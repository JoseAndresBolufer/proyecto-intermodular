<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoraMón Viatges | Inscripción</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

  <aside class="barra-lateral">

    <div class="logo">
      <a href="../index.html">
        <img src="../img/Logo.resize.PNG" alt="VoraMón Viatges">
      </a>
    </div>

    <nav>
      <a href="../index.html">Home</a>

      <a href="inscripcion.html" class="active">Inscripción</a>

      <a href="listado-destinos.html">Destinos</a>

      <a href="listado-usuarios.html">Usuarios</a>

      <a href="listado-guias.html">Guías</a>
    </nav>

  </aside>

  <main class="contenido-principal">

    <header class="cabecera">
      <h1>Inscripción a destino</h1>
      <span>Asignación de usuarios a destinos turísticos</span>
    </header>

    <section class="contenedor-formulario">

      <p class="info-text">
        Selecciona un usuario y un destino para realizar la inscripción.
      </p>

      <form data-form-reserva>

        <h2>Datos de inscripción</h2>

        <div class="grupo-formulario">
          <label for="usuario">Usuario</label>

          <select id="usuario" name="idUsuario" data-select-usuarios required>
            <option value="">
              Cargando usuarios...
            </option>
          </select>
        </div>

        <div class="grupo-formulario">
          <label for="destino">Destino</label>

          <select id="destino" name="idDestino" data-select-destinos required>
            <option value="">
              Cargando destinos...
            </option>
          </select>
        </div>

        <button type="submit">
          Realizar inscripción
        </button>

      </form>

    </section>

    <section class="contenedor-tabla tabla-inscripciones">

      <div class="cabecera-seccion">
        <h2>Inscripciones actuales</h2>
      </div>

      <table>

        <thead>
          <tr>
            <th>Usuario</th>
            <th>Destino</th>
            <th>Pasaporte requerido</th>
            <th>Estado</th>
          </tr>
        </thead>

        <tbody data-tabla-reservas>
          <tr>
            <td colspan="4">
              Cargando inscripciones...
            </td>
          </tr>
        </tbody>

      </table>

    </section>

  </main>

  <script src="../js/main.js"></script>

</body>
</html>
