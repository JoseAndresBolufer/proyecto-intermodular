<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoraMón Viatges | Modificar guía</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

  <aside class="barra-lateral">

    <div class="logo">
      <a href="../index.html">
        <img src="../img/Logo.resize.PNG" alt="VoraMón Viatges">
      </a>
    </div>

    <nav>
      <a href="../index.html">Home</a>

      <a href="inscripcion.html">Inscripción</a>

      <a href="listado-destinos.html">Destinos</a>

      <a href="listado-usuarios.html">Usuarios</a>

      <a href="listado-guias.html" class="active">Guías</a>
    </nav>

  </aside>

  <main class="contenido-principal">

    <header class="cabecera">
      <h1>Modificar guía</h1>
      <span>Edición de datos del guía turístico</span>
    </header>

    <section class="contenedor-formulario">

      <p class="info-text">
        Modifica los datos del guía seleccionado y actualiza su especialidad si es necesario.
      </p>

      <form>

        <h2>Datos del guía</h2>

        <div class="grupo-formulario">
          <label for="nombre">Nombre</label>

          <input 
            type="text"
            id="nombre"
            name="nombre"
            value="María"
            required>
        </div>

        <div class="grupo-formulario">
          <label for="apellidos">Apellidos</label>

          <input 
            type="text"
            id="apellidos"
            name="apellidos"
            value="López"
            required>
        </div>

        <div class="grupo-formulario">
          <label for="nacionalidad">Nacionalidad</label>

          <input 
            type="text"
            id="nacionalidad"
            name="nacionalidad"
            value="Española"
            required>
        </div>

        <div class="grupo-formulario">
          <label for="tipoDocumento">
            Tipo de documento
          </label>

          <select 
            id="tipoDocumento"
            name="tipoDocumento"
            required>

            <option value="dni" selected>
              DNI
            </option>

            <option value="nie">
              NIE
            </option>

            <option value="pasaporte">
              Pasaporte
            </option>

            <option value="otro">
              Otro
            </option>

          </select>
        </div>

        <div class="grupo-formulario">
          <label for="numeroDocumento">
            Número de documento
          </label>

          <input 
            type="text"
            id="numeroDocumento"
            name="numeroDocumento"
            value="12345678A"
            required>
        </div>

        <div class="grupo-formulario">
          <label for="telefono">Teléfono</label>

          <input 
            type="tel"
            id="telefono"
            name="telefono"
            value="600123456"
            pattern="[0-9]{9}"
            required>
        </div>

        <div class="grupo-formulario">
          <label for="email">Email</label>

          <input 
            type="email"
            id="email"
            name="email"
            value="maria@voramon.com"
            required>
        </div>

        <div class="grupo-formulario">
          <label for="especialidad">
            Especialidad
          </label>

          <select 
            id="especialidad"
            name="especialidad"
            required>

            <option value="geografia">
              Geografía
            </option>

            <option value="historia" selected>
              Historia
            </option>

            <option value="arquitectura">
              Arquitectura
            </option>

            <option value="comida">
              Comida
            </option>

          </select>
        </div>

        <div class="grupo-formulario">
          <label for="destinoTrabajo">
            Destino donde trabajará
          </label>

          <select 
            id="destinoTrabajo"
            name="destinoTrabajo"
            required>

            <option value="roma">
              Roma
            </option>

            <option value="tokio">
              Tokio
            </option>

            <option value="paris" selected>
              París
            </option>

          </select>
        </div>

        <div class="botones-formulario">
          <button type="submit">
            Guardar cambios
          </button>

          <button type="button" onclick="history.back()">
            Volver
          </button>
        </div>

      </form>

    </section>

  </main>

  <script src="../js/main.js"></script>

</body>
</html>
