<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoraMón Viatges | Modificar destino</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

  <aside class="barra-lateral">
    <div class="logo">
      <a href="../index.html">
        <img src="../img/Logo.resize.PNG" alt="VoraMón Viatges">
      </a>
    </div>

    <nav>
      <a href="../index.html">Home</a>

      <a href="inscripcion.html">Inscripción</a>

      <a href="listado-destinos.html" class="active">Destinos</a>

      <a href="listado-usuarios.html">Usuarios</a>

      <a href="listado-guias.html">Guías</a>
    </nav>
  </aside>

  <main class="contenido-principal">

    <header class="cabecera">
      <h1>Modificar destino</h1>
      <span>Edición de los datos del destino turístico</span>
    </header>

    <section class="contenedor-formulario">

      <p class="info-text">
        Modifica los datos del destino seleccionado. 
        Estos cambios afectarán a la información mostrada en el listado y en el detalle del destino.
      </p>

      <form>

        <h2>Datos del destino</h2>

        <div class="grupo-formulario">
          <label for="ciudad">Ciudad</label>

          <input 
            type="text"
            id="ciudad"
            name="ciudad"
            value="Tokio"
            required>
        </div>

        <div class="grupo-formulario">
          <label for="pais">País</label>

          <input 
            type="text"
            id="pais"
            name="pais"
            value="Japón"
            required>
        </div>

        <div class="grupo-formulario">
          <label for="precio">Precio (desde)</label>

          <input 
            type="number"
            id="precio"
            name="precio"
            min="0"
            step="0.01"
            value="1200"
            required>
        </div>

        <div class="grupo-formulario">
          <label for="requierePasaporte">¿Requiere pasaporte?</label>

          <select 
            id="requierePasaporte"
            name="requierePasaporte"
            required>

            <option value="true" selected>
              Sí
            </option>

            <option value="false">
              No
            </option>

          </select>
        </div>

        <div class="botones-formulario">
          <button type="submit">
            Guardar cambios
          </button>

          <button type="button" onclick="history.back()">
            Volver
          </button>
        </div>

      </form>

    </section>

  </main>

</body>
</html>
