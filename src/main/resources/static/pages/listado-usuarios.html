<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoraMón Viatges | Usuarios</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

  <aside class="barra-lateral">

    <div class="logo">
      <a href="../index.html">
        <img src="../img/Logo.resize.PNG" alt="VoraMón Viatges">
      </a>
    </div>

    <nav>
      <a href="../index.html">Home</a>

      <a href="inscripcion.html">Inscripción</a>

      <a href="listado-destinos.html">Destinos</a>

      <a href="listado-usuarios.html"  class="active">Usuarios</a>

      <a href="listado-guias.html">Guías</a>
    </nav>

  </aside>

  <main class="contenido-principal">

    <header class="cabecera">
      <h1>Usuarios registrados</h1>
      <span>Gestión y consulta de usuarios de la agencia</span>
    </header>

  <div class="barra-acciones">

    <button onclick="location.href='crear-usuario.html'">
      Crear usuario
    </button>

    <div class="buscador">
      <input type="text" placeholder="Buscar usuario..." data-buscar="#tabla-usuarios">
    </div>

  </div>

   <section class="contenedor-tabla">
    
      <div class="cabecera-seccion">
        <h2>Listado de usuarios</h2>
      </div>

      <table id="tabla-usuarios">

        <thead>
          <tr>
            <th>Nombre</th>
            <th>Email</th>
            <th>Teléfono</th>
            <th>Pasaporte</th>
            <th>Acciones</th>
          </tr>
        </thead>

        <tbody id="tbody-usuarios" data-tabla-usuarios>
          <tr>
            <td colspan="5">Cargando usuarios...</td>
          </tr>
        </tbody>

      </table>

    </section>

  </main>

  <script src="../js/main.js"></script>

</body>
</html>
