<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoraMón Viatges | Crear usuario</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

  <aside class="barra-lateral">
    <div class="logo">
      <a href="../index.html">
        <img src="../img/Logo.resize.PNG" alt="VoraMón Viatges">
      </a>
    </div>

    <nav>
      <a href="../index.html">Home</a>

      <a href="inscripcion.html">Inscripción</a>

      <a href="listado-destinos.html">Destinos</a>

      <a href="listado-usuarios.html" class="active">Usuarios</a>

      <a href="listado-guias.html">Guías</a>
    </nav>
  </aside>

  <main class="contenido-principal">

    <header class="cabecera">
      <h1>Crear usuario</h1>
      <span>Registro de usuarios y datos de pasaporte</span>
    </header>

    <section class="contenedor-formulario">
      <p class="info-text">
        Introduce los datos personales del usuario. El pasaporte es necesario para poder realizar reservas en destinos que lo requieran.
      </p>

      <form>

        <h2>Datos del usuario</h2>

        <div class="grupo-formulario">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" required>
        </div>

        <div class="grupo-formulario">
          <label for="apellidos">Apellidos</label>
          <input type="text" id="apellidos" name="apellidos" required>
        </div>

        <div class="grupo-formulario">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="grupo-formulario">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono" pattern="[0-9]{9}" placeholder="Ej: 600123456" required>
        </div>

        <div class="grupo-formulario">
          <label for="fechaNacimiento">Fecha de nacimiento</label>
          <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
        </div>

        <div class="grupo-formulario">
          <label for="nacionalidad">Nacionalidad</label>
        <input 
        type="text" 
        id="nacionalidad" 
        name="nacionalidad" 
        placeholder="Ej: Española"
        required>
        </div>

        <h2>Datos del pasaporte</h2>

        <div class="grupo-formulario">
          <label for="numeroPasaporte">Número de pasaporte</label>
          <input type="text" id="numeroPasaporte" name="numeroPasaporte">
        </div>

        <div class="grupo-formulario">
          <label for="paisExpedicion">País de expedición</label>
          <input type="text" id="paisExpedicion" name="paisExpedicion">
        </div>

        <div class="grupo-formulario">
          <label for="fechaCaducidad">Fecha de caducidad</label>
          <input type="date" id="fechaCaducidad" name="fechaCaducidad">
        </div>

        <button type="submit">Guardar usuario</button>

      </form>
    </section>

  </main>

</body>
</html>
